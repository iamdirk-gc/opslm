[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opslm"
version = "0.0.1"
description = "Open-source toolkit for semantic data harmonization and model evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/opslm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
